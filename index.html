<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJT Portfolio</title>
    <!-- Link to external stylesheet for Deep Ocean theme styling -->
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

    <!-- MAIN HEADER GROUPING -->
    <header class="header">
        <!-- SECTION 1: STICKY NAVIGATION BAR -->
        <!-- Navigation container positioned at the top of the viewport during scroll -->
        <nav class="navbar">
            <!-- Brand link or student name initialization -->
            <a href="#" class="nav-logo"><span>Portfolio</span></a>
            <!-- Anchor links navigating to Overview, Documents, and Contact sections -->
            <ul class="nav-links">
                <li><a href="#overview" class="nav-item">Overview</a></li>
                <li><a href="#documents" class="nav-item">Documents</a></li>
                <li><a href="#footer" class="nav-item">Contact</a></li>
            </ul>
        </nav>


        <!-- SECTION 2: HERO / LANDING OVERVIEW -->
        <!-- Main introductory layout container -->
        <section class="hero" id="overview">
            <div class="hero-content">
                <!-- Header displaying student name and degree program -->
                <h1 class="hero-title">Victoria Yuki M. Ilano</h1>
                <h2 class="hero-subtitle">Bachelor of Science in Computer Engineering</h2>
                
                <!-- Subheaders indicating target host company, role, and OJT hour tracking status -->
                <div class="hero-details">
                    <p class="detail-item"><i class="fa-solid fa-building"></i> <strong>Company:</strong> Applying</p>
                    <p class="detail-item"><i class="fa-solid fa-user-gear"></i> <strong>Role:</strong> Computer Engineering Intern</p>
                    <p class="detail-item"><i class="fa-solid fa-clock"></i> <strong>OJT Hours:</strong> 300 Required (0 Rendered)</p>
                </div>
                
                <!-- Quick-action button linking directly to Curriculum Vitae document -->
                <a href="#" class="btn-cv" target="_blank">View Curriculum Vitae <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </section>
    </header>


    <!-- SECTION 3: DOCUMENT PORTFOLIO GRID -->
    <!-- Core layout container for academic paperwork compliance -->
    <main class="portfolio-container" id="documents">
        
        <!-- Sub-section: Tab Filtering System -->
        <!-- Interactive buttons filtering documents by execution phase: Before OJT, During OJT, After OJT -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">All Documents</button>
            <button class="tab-btn" data-filter="before">Before OJT</button>
            <button class="tab-btn" data-filter="during">During OJT</button>
            <button class="tab-btn" data-filter="after">After OJT</button>
        </div>

        <!-- Sub-section: Document Cards Grid Layout -->
        <!-- Responsive grid container adjusting column counts automatically across screen dimensions -->
        <div class="document-grid">
            
            <!-- Document Card Templates -->
            <!-- Before OJT Cards: Cover Page, LOI, LOE, MOA, Student Waiver, Internship Agreement, Consent Form, CV, Insurance, Medical Certificate -->
            <!-- During OJT Cards: Company Profile, Monthly Reports -->
            <!-- After OJT Cards: Approval Sheet, Certificate of Completion, Trainee Evaluation, Performance Evaluation -->
            
            <!-- Internal Card Structure Blueprint -->
            <!-- Container displaying document title, phase category tag, current completion status badge, and an external hyperlink opening the target Google Drive file in a new browser tab -->
            
        </div>
    </main>


    <!-- SECTION 4: FOOTER -->
    <!-- Bottom layout container for secondary tracking notes -->
    <!-- Copyright notice and academic affiliation tracking lines -->

    <!-- Link to external JavaScript file handling document grid tab filtering logic -->
    <script src="assets/script.js"></script>
</body>
</html>
